[package]
name = "esm-viewer"
version = "0.2.0"
description = "A local-first desktop viewer for digital tachograph files."
authors = ["Milan Bolaric"]
edition = "2024"

[lib]
name = "esm_viewer_desktop_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "esm-viewer"
path = "src/main.rs"
required-features = ["standalone"]

[build-dependencies]
pkg-config = "0.3"
tauri-build = { version = "2.1", features = [] }

[features]
default = ["standalone"]
standalone = []
devtools = ["tauri/devtools"]
test-support = ["tauri/test"]

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
esm-parser = { path = "../vendor/esm-parser" }
sha2 = "0.11"
hex = "0.4"
time = { version = "0.3", features = ["formatting"] }
genpdfi = { version = "0.2", features = ["hyphenation"] }
hyphenation = { version = "0.8", features = ["embed_all"] }

[dev-dependencies]
tauri = { version = "2.2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSPrintInfo", "NSPrintOperation", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSDate", "NSDictionary", "NSError", "NSRunLoop", "NSString", "NSURL"] }
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = ["std", "PDFDocument", "objc2-app-kit"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Data_Pdf", "Graphics_Imaging", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_Memory", "Win32_System_WinRT", "Win32_UI_Controls_Dialogs"] }
