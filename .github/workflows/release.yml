name: Release Packaging

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-tauri:
        name: Build Native Installers (${{ matrix.platform }} - ${{ matrix.build_type }})
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                platform: [macos-26, windows-latest, ubuntu-24.04]
                build_type: [release, debug]
        runs-on: ${{ matrix.platform }}
        timeout-minutes: 45

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: Install Linux build dependencies
              if: matrix.platform == 'ubuntu-24.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libpoppler-glib-dev pkg-config patchelf

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  architecture: x64
                  check-latest: false
                  node-version-file: .node-version
                  package-manager-cache: false

            - name: Enable pinned pnpm
              run: |
                  corepack enable
                  pnpm --version

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Install frozen dependency graph
              run: pnpm install --frozen-lockfile

            - name: Verify release versions and build policy
              run: pnpm exec vitest run apps/viewer/__tests__/build-policy.test.ts --project node

            - name: Prepare macOS icon compiler
              if: startsWith(matrix.platform, 'macos')
              run: |
                  tool_dir="$RUNNER_TEMP/tauri-actool"
                  mkdir -p "$tool_dir"
                  install -m 755 .github/scripts/actool.sh "$tool_dir/actool"
                  printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"

            # Tauri skips the tinted-capable Assets.car with only a warning when
            # actool is older than 26, which would ship a flat legacy icon.
            - name: Require Xcode 26+ for the macOS app icon
              if: startsWith(matrix.platform, 'macos')
              run: |
                  version=$(xcrun actool --version | python3 -c 'import plistlib, sys; print(plistlib.loads(sys.stdin.buffer.read())["com.apple.actool.version"]["short-bundle-version"])')
                  echo "actool $version"
                  if [ "${version%%.*}" -lt 26 ]; then
                      echo "::error::actool $version is older than 26; Assets.car would be skipped"
                      exit 1
                  fi

            - name: Build Tauri native packages
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  APPLE_SIGNING_IDENTITY: '-'
              with:
                  tagName: ${{ github.ref_name }}
                  releaseName: 'ESM Viewer ${{ github.ref_name }}'
                  releaseBody: 'Release ${{ github.ref_name }} of ESM Viewer digital tachograph desktop application.'
                  releaseDraft: true
                  prerelease: ${{ matrix.build_type == 'debug' }}
                  includeDebug: ${{ matrix.build_type == 'debug' }}
                  includeRelease: ${{ matrix.build_type == 'release' }}
                  args: ${{ matrix.build_type == 'debug' && '--features devtools' || '' }}
